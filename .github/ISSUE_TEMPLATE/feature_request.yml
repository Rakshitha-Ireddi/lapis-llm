name: Feature request
description: Suggest an idea for LapisLLM.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: adr
    attributes:
      label: Scope
      options:
        - label: This changes an architecture decision in docs/adr (I'll propose an ADR)
